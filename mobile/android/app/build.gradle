plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.brenocruz.controlefinanceiro'
    compileSdk 35

    def configuredServerUrl = (project.findProperty('appServerUrl') ?: '').toString()
    def escapedServerUrl = configuredServerUrl.replace('\\', '\\\\').replace('"', '\\"')

    defaultConfig {
        applicationId 'br.com.brenocruz.controlefinanceiro'
        minSdk 23
        targetSdk 35
        versionCode 106
        versionName '1.0.6'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + escapedServerUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }
}
