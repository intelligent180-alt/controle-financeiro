plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.brenocruz.controlefinanceiro'
    compileSdk 35

    // O APK ja sai apontando para a hospedagem oficial. A propriedade continua
    // disponivel apenas para ambientes de teste, sem exigir configuracao no celular.
    def configuredServerUrl = (project.findProperty('appServerUrl') ?: 'https://financeiro.byethost32.com/').toString()
    def escapedServerUrl = configuredServerUrl.replace('\\', '\\\\').replace('"', '\\"')

    defaultConfig {
        applicationId 'br.com.brenocruz.controlefinanceiro'
        minSdk 23
        targetSdk 35
        versionCode 108
        versionName '1.0.8'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + escapedServerUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }
}
